    <meta charset="UTF-8" />

    <title>PotenFYR Studios — Documentation Hub</title>
    <meta name="description" content="Unified documentation for every public PotenFYR-Studios repository: hosting eggs, Minecraft tooling, security & dev tools." />
    <meta property="og:title" content="PotenFYR Studios — Documentation Hub" />

  </head>
  <body>
    <div id="root"></div>
    <script>
      // Persist a 404.html redirect target if one is pending.
      if (location.hash.startsWith("#/") === false && sessionStorage.getItem("pp-404-path")) {
        location.replace("#" + sessionStorage.getItem("pp-404-path"));
        sessionStorage.removeItem("pp-404-path");
      }
    </script>
  </body>
</html>
